  <ellipse id="leaf-left-3" cx="79" cy="149" rx="5" ry="10" transform="rotate(-54 79 149)"/>
  <ellipse id="leaf-right-3" cx="177" cy="149" rx="5" ry="10" transform="rotate(54 177 149)"/>
  <ellipse id="leaf-left-4" cx="88" cy="161" rx="5" ry="10" transform="rotate(-54 88 161)"/>
  <ellipse id="leaf-right-4" cx="168" cy="161" rx="5" ry="10" transform="rotate(54 168 161)"/>
  <ellipse id="leaf-left-5" cx="97" cy="172" rx="5" ry="10" transform="rotate(-48 97 172)"/>
  <ellipse id="leaf-right-5" cx="159" cy="172" rx="5" ry="10" transform="rotate(48 159 172)"/>
</g>

  <g id="architectural-column">
