    <circle id="inner-blue-ring" cx="128" cy="128" r="92" fill="none" stroke="#315D8C" stroke-width="1.35" opacity=".45"/>
    <path id="north-mark" d="M128 39 L133 45 L128 51 L123 45 Z" fill="#B78A55" />
    <circle id="south-mark" cx="128" cy="211" r="3.3" fill="#B78A55"/>
  </g>
<g id="laurel-frame" fill="none" stroke="#315D8C" stroke-width="2.6" stroke-linecap="round" opacity=".94">
      <path id="left-stem" d="M95 180 C75 165 61 143 72 109" />
      <path id="right-stem" d="M161 180 C181 165 195 143 184 109" />
    </g>
<g id="laurel-leaves" fill="#315D8C" opacity=".94">
